<div
  class="mx-auto box-border flex h-full min-h-0 w-full flex-col overflow-hidden p-4"
  dir="rtl"
>
  @if (error) {
    <div class="mb-3 shrink-0 rounded-[5px] border border-red-100 bg-red-50 p-3 text-sm text-red-700">
      {{ error }}
    </div>
  }

  <div class="mb-3 flex shrink-0 items-center justify-end gap-3">
    @if (canCreate) {
      <base-button type="button" color="blue" size="sm" (click)="openCreate()">
        {{ 'modules.admin.companyRegulations.add' | transloco }}
      </base-button>
    }
  </div>

  <div class="base-grid-panel flex min-h-0 flex-1 flex-col overflow-hidden">
    <base-grid
      gridId="c8e4a1b2-7f39-4d5a-9c16-2e8b0a4d6f71"
      class="min-h-0 w-full flex-1"
      [framed]="false"
      [visibleOrder]="false"
      [columnDefs]="colDef"
      [dataSource$]="list$"
      [disabled]="loading"
      [toolbarDisabled]="true"
      [noRowsMessage]="'modules.admin.companyRegulations.empty' | transloco"
      forceDirection="rtl"
    />
  </div>
</div>
