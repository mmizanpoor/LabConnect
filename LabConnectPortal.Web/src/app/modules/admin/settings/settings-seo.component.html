<div class="mx-auto max-w-3xl p-6" dir="rtl">
  @if (error) {
    <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>
  }
  @if (success) {
    <div class="mb-4 rounded-lg bg-green-50 p-3 text-sm text-green-700">{{ success }}</div>
  }

  @if (loading) {
    <p class="text-gray-500">{{ 'shared.loading' | transloco }}</p>
  } @else {
    <div
      class="overflow-hidden rounded-[5px] border border-slate-200 bg-white p-5 shadow-[0_1px_3px_rgba(15,23,42,0.06)] md:p-6"
    >
      <h2 class="mb-5 text-lg font-bold text-slate-800">
        {{ 'modules.admin.settings.sections.seo' | transloco }}
      </h2>

      <form [formGroup]="form" class="flex flex-col gap-5">
        <base-form-field
          class="w-full"
          layout="floating"
          [label]="'modules.admin.settings.fields.metaTitle' | transloco"
          [control]="form.controls.metaTitle"
        />
        <base-form-field
          class="w-full"
          layout="floating"
          [multiline]="true"
          [rows]="3"
          [label]="'modules.admin.settings.fields.metaDescription' | transloco"
          [control]="form.controls.metaDescription"
        />
        <base-form-field
          class="w-full"
          layout="floating"
          [label]="'modules.admin.settings.fields.metaKeywords' | transloco"
          [control]="form.controls.metaKeywords"
        />
        <base-form-field
          class="w-full"
          layout="floating"
          [label]="'modules.admin.settings.fields.metaViewport' | transloco"
          [control]="form.controls.metaViewport"
        />
        <base-form-field
          class="w-full"
          layout="floating"
          type="url"
          [label]="'modules.admin.settings.fields.metaCanonical' | transloco"
          [control]="form.controls.metaCanonical"
        />
      </form>

      @if (canUpdate) {
        <div class="mt-6">
          <base-button color="green" size="sm" [disabled]="saving || form.invalid" (click)="save()">
            {{ 'shared.save' | transloco }}
          </base-button>
        </div>
      }
    </div>
  }
</div>
