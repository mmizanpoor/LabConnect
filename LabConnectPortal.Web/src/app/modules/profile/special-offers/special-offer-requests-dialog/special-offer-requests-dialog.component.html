<div class="px-6 py-5" dir="rtl">
  <div class="mb-5 flex items-start justify-between gap-3">
    <div>
      <h2 class="m-0 text-xl font-extrabold text-slate-900">
        {{ 'modules.profile.specialOffers.requestsDialog.title' | transloco }}
      </h2>
      <p class="mb-0 mt-1.5 text-sm font-semibold text-slate-500">{{ data.offerTitle }}</p>
    </div>
    <button mat-icon-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (error) {
    <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>
  }

  @if (loading) {
    <p class="text-sm text-slate-500">{{ 'shared.loading' | transloco }}</p>
  } @else if (!rows.length) {
    <p class="text-sm text-slate-500">{{ 'modules.profile.specialOffers.requestsDialog.empty' | transloco }}</p>
  } @else {
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_8px_24px_rgb(15_23_42/0.06)]">
      <base-grid
        gridId="2c0b2ccf-5f2e-4596-8c6f-2d28f2a4e9fb"
        class="w-full h-[55vh] min-h-[22rem]"
        [visibleOrder]="false"
        [columnDefs]="colDef"
        [dataSource$]="list$"
        [disabled]="loading"
        [toolbarDisabled]="true"
        forceDirection="rtl"
      />
    </div>
  }
</div>
