<div
  class="mx-auto box-border flex h-full min-h-0 w-full flex-col overflow-hidden p-4"
  dir="rtl"
>
  @if (canCreate) {
  <div class="mb-3 flex shrink-0 items-center justify-end">
    <base-button color="blue" size="sm" (click)="openCreate()">{{
      "modules.profile.kitGroups.add" | transloco
    }}</base-button>
  </div>
  }

  @if (error) {
  <div class="mb-3 shrink-0 rounded-lg bg-red-50 p-3 text-sm text-red-700">
    {{ error }}
  </div>
  }

  <div
    class="base-grid-panel flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm"
  >
    <base-grid
      gridId="8a9c2b3c-2c73-4aa3-8c55-1b99e840b5af"
      class="min-h-0 w-full flex-1"
      [visibleOrder]="false"
      [columnDefs]="colDef"
      [dataSource$]="list$"
      [disabled]="loading"
      [toolbarDisabled]="true"
      [noRowsMessage]="'modules.profile.kitGroups.empty' | transloco"
      forceDirection="rtl"
    />
  </div>
</div>
