<base-dialog
  [title]="
    (data.group ? 'modules.profile.kitGroups.editTitle' : 'modules.profile.kitGroups.addTitle')
      | transloco
  "
>
  <div class="min-w-[320px]" dir="rtl">
    @if (error) {
    <div class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>
    }

    <form [formGroup]="form" class="flex flex-col gap-5">
      <base-form-field
        class="w-full"
        layout="floating"
        icon="inventory_2"
        [required]="true"
        [label]="'modules.profile.kitGroups.fields.title' | transloco"
        [control]="form.controls.title"
      />
    </form>
  </div>

  <div baseDialogActions class="flex items-center justify-end gap-2">
    <base-button type="button" color="warn" size="sm" (click)="cancel()">
      {{ "shared.cancel" | transloco }}
    </base-button>
    <base-button color="green" size="sm" [disabled]="form.invalid" [loading]="saving" (click)="save()">
        {{ "shared.save" | transloco }}
      </base-button>
  </div>
</base-dialog>
